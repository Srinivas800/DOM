<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style1.css">
    <title>TODO LIST</title>
</head>
<body>
    <main class="card">
        <header id="header">
            <h1 id="heading">MY  TODO  LIST</h1>
            <button id="theme" type="button">Dark mode</button>
        </header>

        <div class="add-row">
            <input type="text" id="input" placeholder="Enter a task" autocomplete="off">
            <button id="add" type="button">Add Task</button>
        </div>

        <div class="progress">
            <p id="count">0 of 0 done</p>
            <div class="bar"><div id="fill"></div></div>
        </div>

        <div class="filters" role="group" aria-label="Filter tasks">
            <button type="button" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter="active" aria-pressed="false">Active</button>
            <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>

        <ul class="task-list" id="tasklist"></ul>
        <p id="empty"></p>
    </main>

    <p class="byline">
    by <a href="https://srinivassayinni.netlify.app/" target="_blank" rel="noopener noreferrer">Srinivas Sayinni</a>
</p>
    <canvas id="confetti"></canvas>
    <script src="DOM4.js"></script>
</body>
</html>
